<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>리스트로 매뉴 만들기</title>
        <style>
    #member{
        background:olive;
    }
    #member ul{margin:0; padding:0; width:567px;}
    #member ul li{
        display:inline-block;
        list-style-type:none;
        padding:0px 15px;
    }
    #member ul li a{
        color:white;
        text-decoration:none;}
        #member ul li a:hover{
            color:violet;
        }
    </style>
    </head>
     <body>
        <nav id="menubar">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Espresso</a></li>
                <li><a href="#">Cappuccino</a></li>
                <li><a href="#">Cafe Latte</a></li>
                <li><a href="#">F.A.Q</a></li>
            </ul>
        </nav>        
    </body>
   
    
</html>
