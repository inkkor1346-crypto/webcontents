<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>도형서식 폼 만들기</title>
    </head>
    <body>
        <h3>도형 서식 폼 만들기</h3>
        <form>
            선종류
            <select name="선" size="3">
                <option value="1">선없음</option>
                <option value="1">실선</option>
                <option value="1">점선</option>
            </select>
            <br>
            선두께 <td><input type="text"></td>
            선색 <input type="color" value="#00BFFF">
            <br>
            투명도(0~100):
            <input type="range" min="0" max="100">
            <datalist id = "투명도">
                <option value="10" label="Low"></option>
                <option value="50" label="Medium"></option>
                <option value="90" label="High"></option>
            </datalist>
            
        </form>
    </body>
</html>
